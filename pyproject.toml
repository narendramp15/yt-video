[project]
name = "yt-video"
version = "0.1.0"
description = "Trend-driven YouTube pipeline (Claude CLI + Edge TTS + free image providers + local FFmpeg)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core AI / LLM
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # FREE TTS — Microsoft Edge TTS
    "edge-tts>=7.3.1",

    # FREE trend signals
    "pytrends>=4.9.2",
    "beautifulsoup4>=4.12.0",

    # Market data (news headlines for topic discovery)
    "yfinance>=0.2.40",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",

    # Video assembly (local MoviePy + FFmpeg)
    "moviepy>=2.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",

    # YouTube upload
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.0.0",

    # HTTP / X posting
    "requests>=2.31.0",
    "requests-oauthlib>=2.0.0",
]

[project.optional-dependencies]
# Local Whisper (free). Some platforms need Python ≤3.12 for ctranslate2.
whisper = [
    "faster-whisper>=1.0.0",
]
# Local CLIP image-vs-scene verification (CPU).
clip = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]
all = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_video"]

[project.scripts]
yt-video = "yt_video.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = ["live: real network/CLI calls"]
addopts = "-m 'not live'"
testpaths = ["tests"]
